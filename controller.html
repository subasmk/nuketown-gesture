<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nuketown Phone Controller</title>
<style>
  html, body { margin:0; height:100%; background:#10151d; color:#eef3f8; font-family: system-ui, sans-serif; touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  #pair { padding:24px; text-align:center; }
  #pair h1 { font-size:20px; }
  #pair input { font-size:28px; letter-spacing:6px; text-transform:uppercase; text-align:center; width:180px; padding:10px; border-radius:10px; border:2px solid #3a4b61; background:#182431; color:#fff; }
  #pair button, .bigbtn { font-size:18px; padding:14px 22px; border-radius:12px; border:0; background:#ffd23e; color:#141a22; font-weight:700; }
  #status { margin-top:14px; color:#9fb4c8; min-height:20px; }
  #ctl { position:fixed; inset:0; display:none; }
  #topbar { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:#182431cc; font-size:13px; }
  #joyZone { position:absolute; left:4%; bottom:10%; width:150px; height:150px; border-radius:50%; background:#ffffff14; border:2px solid #ffffff2e; }
  #joyNub { position:absolute; left:50%; top:50%; width:62px; height:62px; margin:-31px 0 0 -31px; border-radius:50%; background:#ffffff30; border:2px solid #ffffff55; }
  .rbtn { position:absolute; border-radius:50%; border:2px solid #ffffff40; color:#fff; font-weight:800; }
  #fireBtn { right:5%; bottom:12%; width:118px; height:118px; background:#e33f2fdd; font-size:19px; }
  #fireBtn.on { background:#ff6b4a; }
  #jumpBtn { right:22%; bottom:8%; width:74px; height:74px; background:#2f7fe3dd; font-size:13px; }
  #hint { position:absolute; bottom:4px; left:0; right:0; text-align:center; font-size:11px; color:#7d93a9; }
  #sensBar { position:absolute; top:44px; left:0; right:0; display:flex; justify-content:center; align-items:center; gap:8px; font-size:12px; color:#9fb4c8; }
  #sensBar input { width:140px; accent-color:#ffd23e; }
</style>
</head>
<body>
<div id="pair">
  <h1>📱 NUKETOWN CONTROLLER</h1>
  <p>The laptop screen shows a 4-letter code.<br>Type it here:</p>
  <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters">
  <p><button id="connect">CONNECT + ENABLE GYRO</button></p>
  <div id="status">Works over the internet - no same-Wi-Fi needed. Hold the phone sideways, like a gun.</div>
</div>

<div id="ctl">
  <div id="topbar"><span id="ctlStatus">connected</span><span>🔊 Android: VOL UP = fire · VOL DOWN = jump</span></div>
  <div id="sensBar"><label for="sens">Aim sensitivity</label><input id="sens" type="range" min="0.3" max="2.5" step="0.1" value="1"><span id="sensVal">1.0×</span></div>
  <div id="joyZone"><div id="joyNub"></div></div>
  <button class="rbtn" id="jumpBtn">JUMP</button>
  <button class="rbtn" id="fireBtn">FIRE</button>
  <div id="hint">Left thumb = move stick · Turn phone = aim · Hold FIRE to shoot</div>
</div>

<audio id="volEar" loop preload="auto" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>

<script>
'use strict';
const V = 11; // net-protocol VERSION
let ws = null, code = '', latest = { a: 0, b: 0, g: 0 }, haveGyro = false;
let joy = [0, 0], firing = false, jumpPulse = false, volFireUntil = 0, sens = 1;
const $ = id => document.getElementById(id);

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function sendState() { send({ t: 'ctl', v: V, o: [latest.a, latest.b, latest.g], s: (screen.orientation && screen.orientation.angle) || 0, j: joy, f: firing || performance.now() < volFireUntil ? 1 : 0, jump: jumpPulse ? 1 : 0, sn: sens }); jumpPulse = false; }

async function connect() {
  code = $('code').value.trim().toUpperCase();
  if (code.length < 4) { $('status').textContent = 'Enter the 4-letter code from the laptop.'; return; }
  // iOS asks permission for motion sensors inside a user gesture.
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function')
      await DeviceOrientationEvent.requestPermission();
  } catch (e) {}
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host + '/ws');
  ws.addEventListener('open', () => send({ t: 'ctl-hello', v: V, code }));
  ws.addEventListener('message', e => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === 'ctl-ok') {
      $('pair').style.display = 'none';
      $('ctl').style.display = 'block';
      $('ctlStatus').textContent = '📱 Connected — code ' + code + (haveGyro ? '' : ' (waiting for gyro…)');
      startVolumeEar();
      if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
    }
  });
  ws.addEventListener('close', () => { $('ctlStatus').textContent = 'Disconnected — reload to reconnect.'; });
  $('status').textContent = 'Connecting…';
}

addEventListener('deviceorientation', e => {
  if (e.alpha === null) return;
  latest = { a: e.alpha, b: e.beta || 0, g: e.gamma || 0 }; haveGyro = true;
});

/* --- joystick (left thumb) --- */
const joyZone = $('joyZone'), nub = $('joyNub');
let joyId = null;
function joyMove(e) {
  const r = joyZone.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const m = Math.hypot(dx, dy), max = r.width / 2;
  if (m > max) { dx *= max / m; dy *= max / m; }
  nub.style.transform = `translate(${dx}px, ${dy}px)`;
  joy = [Math.round(dx / max * 100) / 100, Math.round(-dy / max * 100) / 100]; // [strafe, fwd] — up = forward
  sendState();
}
joyZone.addEventListener('pointerdown', e => { joyId = e.pointerId; joyZone.setPointerCapture(joyId); joyMove(e); });
joyZone.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => { if (e.pointerId === joyId) { joyId = null; joy = [0, 0]; nub.style.transform = ''; sendState(); } };
joyZone.addEventListener('pointerup', joyEnd);
joyZone.addEventListener('pointercancel', joyEnd);

/* --- buttons --- */
const fireBtn = $('fireBtn');
fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); firing = true; fireBtn.classList.add('on'); sendState(); });
const fireOff = e => { firing = false; fireBtn.classList.remove('on'); sendState(); };
fireBtn.addEventListener('pointerup', fireOff);
fireBtn.addEventListener('pointercancel', fireOff);
fireBtn.addEventListener('pointerleave', fireOff);
$('jumpBtn').addEventListener('pointerdown', e => { e.preventDefault(); jumpPulse = true; sendState(); });

/* --- Android volume keys (experimental) ---
   Browsers never deliver volume key presses to a page. What Chrome on
   Android DOES deliver is a 'volumechange' on a playing media element
   when the hardware buttons move the media volume. Watching a silent
   loop pinned at 0.5: up-press => volume rises => FIRE burst; down =>
   JUMP. The level is reset to 0.5 after every press so the next press
   registers again. iOS does not fire this for hardware keys — the
   on-screen buttons are the fallback there. */
let volGuard = false;
function startVolumeEar() {
  const ear = $('volEar');
  try { ear.volume = 0.5; ear.play().catch(() => {}); } catch (e) { return; }
  ear.addEventListener('volumechange', () => {
    if (volGuard) return;
    const v = ear.volume;
    if (v > 0.56) { volFireUntil = performance.now() + 260; sendState(); $('ctlStatus').textContent = '🔊 VOL UP — FIRE'; }
    else if (v < 0.44) { jumpPulse = true; sendState(); $('ctlStatus').textContent = '🔊 VOL DOWN — JUMP'; }
    else return;
    volGuard = true;
    setTimeout(() => { try { ear.volume = 0.5; } catch (e) {} setTimeout(() => { volGuard = false; }, 120); }, 60);
  });
}

$('sens').addEventListener('input', e => { sens = parseFloat(e.target.value) || 1; $('sensVal').textContent = sens.toFixed(1) + '×'; });
$('connect').addEventListener('click', connect);
/* Connect as soon as the 4-letter code is typed - no extra tap needed.
   The button stays for retries. Typing is a user gesture, so the iOS
   motion-permission prompt inside connect() still works. */
let autoTried = false;
$('code').addEventListener('input', e => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (e.target.value.length < 4) { autoTried = false; return; }
  if (!autoTried) { autoTried = true; connect(); }
});
setInterval(sendState, 50); // 20 Hz state stream
</script>
</body>
</html>
