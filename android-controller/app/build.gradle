plugins { id 'com.android.application' }
android {
    namespace 'com.subasmk.nuketown'
    compileSdk 34
    defaultConfig {
        applicationId 'com.subasmk.nuketown.controller'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '4.2'
    }
    /* The debug key is no longer committed: the old one leaked with the public
       repo, so v4.0 signs with a fresh local key (installs need one uninstall of
       the old app first). Generate your own once - see README - and keep it at
       ../debug.keystore or point NUKETOWN_KEYSTORE at it. Debug key only. */
    signingConfigs {
        debug {
            storeFile file(System.getenv('NUKETOWN_KEYSTORE') ?: '../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
