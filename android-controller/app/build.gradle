plugins { id 'com.android.application' }
android {
    namespace 'com.subasmk.nuketown'
    compileSdk 34
    defaultConfig {
        applicationId 'com.subasmk.nuketown.controller'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }
    /* One debug key, committed on purpose, so every sideloaded build signs the
       same way and upgrades install over the previous APK instead of needing an
       uninstall. Debug key only - never used for anything else. */
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
